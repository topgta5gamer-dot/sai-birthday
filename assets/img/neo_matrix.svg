<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" width="100%" height="100%" aria-label="Neo offering the Red Pill and the Blue Pill">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="matrixBgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#003B11" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#021408" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#010803" stop-opacity="1"/>
    </radialGradient>

    <!-- Sunglasses Lens Reflection (Matrix Green Code Stream) -->
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#031A08"/>
      <stop offset="35%" stop-color="#00FF66"/>
      <stop offset="45%" stop-color="#0B3818"/>
      <stop offset="100%" stop-color="#010803"/>
    </linearGradient>

    <!-- Red Pill Gradient (Vivid 3D) -->
    <linearGradient id="redPillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D6D"/>
      <stop offset="40%" stop-color="#D90429"/>
      <stop offset="85%" stop-color="#6B0014"/>
      <stop offset="100%" stop-color="#3A000A"/>
    </linearGradient>
    <filter id="redPillGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Blue Pill Gradient (Vivid 3D) -->
    <linearGradient id="bluePillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#48CAE4"/>
      <stop offset="40%" stop-color="#0077B6"/>
      <stop offset="85%" stop-color="#023E8A"/>
      <stop offset="100%" stop-color="#03045E"/>
    </linearGradient>
    <filter id="bluePillGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Trenchcoat Shadow -->
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A221C"/>
      <stop offset="50%" stop-color="#0D130F"/>
      <stop offset="100%" stop-color="#050806"/>
    </linearGradient>

    <!-- Skin Tone Shadow & Matrix Rim Light -->
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D6A584"/>
      <stop offset="65%" stop-color="#B88062"/>
      <stop offset="100%" stop-color="#543324"/>
    </linearGradient>
  </defs>

  <!-- Dark Atmospheric Backdrop with Matrix Vignette -->
  <rect width="520" height="380" rx="16" fill="url(#matrixBgGlow)"/>

  <!-- Matrix Code Stream Elements in Background -->
  <g opacity="0.25" font-family="'Courier New', monospace" font-size="11" fill="#00FF66">
    <text x="30" y="40">01010100</text>
    <text x="30" y="65">10110010</text>
    <text x="30" y="90">01100101</text>
    <text x="70" y="30">S A I</text>
    <text x="70" y="55">1 2 1 7</text>
    <text x="70" y="80">0 1 0 1</text>
    <text x="440" y="35">N E O</text>
    <text x="440" y="60">01101</text>
    <text x="440" y="85">11010</text>
    <text x="475" y="45">10011</text>
    <text x="475" y="70">01010</text>
  </g>

  <!-- Neo / Keanu Reeves Figure -->
  <g id="neo-character">
    <!-- Trenchcoat Body & Shoulders -->
    <path d="M 140,380 L 160,260 L 210,185 L 260,195 L 310,185 L 360,260 L 380,380 Z" fill="url(#coatGrad)"/>
    
    <!-- High Trenchcoat Collar -->
    <path d="M 195,190 L 215,135 L 245,185 Z" fill="#141C16" stroke="#00FF66" stroke-width="0.75" stroke-opacity="0.3"/>
    <path d="M 325,190 L 305,135 L 275,185 Z" fill="#141C16" stroke="#00FF66" stroke-width="0.75" stroke-opacity="0.3"/>
    
    <!-- Inner Shirt / Vest -->
    <polygon points="245,185 260,240 275,185" fill="#080C09"/>

    <!-- Neck -->
    <path d="M 242,165 L 242,130 L 278,130 L 278,165 Z" fill="#A87255"/>

    <!-- Head & Chiseled Jawline -->
    <path d="M 230,120 C 230,80 290,80 290,120 C 290,145 275,165 260,165 C 245,165 230,145 230,120 Z" fill="url(#faceGrad)"/>

    <!-- Keanu Reeves Sleek Black Hair -->
    <path d="M 224,115 C 220,70 250,55 260,55 C 275,55 300,70 296,115 C 292,85 285,72 260,72 C 235,72 228,85 224,115 Z" fill="#0A0D0B"/>
    <path d="M 224,110 C 220,128 228,145 232,135 C 234,120 228,110 224,110 Z" fill="#080A09"/>
    <path d="M 296,110 C 300,128 292,145 288,135 C 286,120 292,110 296,110 Z" fill="#080A09"/>

    <!-- Iconic Matrix Frameless / Narrow Oval Sunglasses -->
    <g id="neo-sunglasses">
      <!-- Bridge -->
      <path d="M 256,116 L 264,116" stroke="#111" stroke-width="2"/>
      <!-- Left Lens (from viewer) -->
      <path d="M 236,114 C 236,110 254,110 254,115 C 254,122 236,122 236,114 Z" fill="url(#lensGrad)" stroke="#111" stroke-width="1.5"/>
      <!-- Green code reflection glint -->
      <line x1="242" y1="112" x2="249" y2="117" stroke="#80FFB2" stroke-width="1.2" stroke-linecap="round"/>

      <!-- Right Lens (from viewer) -->
      <path d="M 266,114 C 266,110 284,110 284,115 C 284,122 266,122 266,114 Z" fill="url(#lensGrad)" stroke="#111" stroke-width="1.5"/>
      <!-- Green code reflection glint -->
      <line x1="272" y1="112" x2="279" y2="117" stroke="#80FFB2" stroke-width="1.2" stroke-linecap="round"/>
    </g>

    <!-- Nose & Mouth Subtle Shading -->
    <path d="M 258,124 L 260,135 L 264,135" fill="none" stroke="#7A4B35" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="254" y1="146" x2="266" y2="146" stroke="#663A25" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Subtle Stubble / Shadow -->
    <path d="M 252,152 Q 260,157 268,152" fill="none" stroke="#6B412F" stroke-width="1" opacity="0.6"/>

    <!-- Extended Arms Towards Viewer -->
    <!-- Left Arm (Holding Red Pill - Viewer's Left) -->
    <path d="M 160,260 L 95,290 L 125,320 L 195,290 Z" fill="#0C120E"/>
    <!-- Right Arm (Holding Blue Pill - Viewer's Right) -->
    <path d="M 360,260 L 425,290 L 395,320 L 325,290 Z" fill="#0C120E"/>

    <!-- Neo's Open Palms Extended Forward -->
    <!-- Hand Left (Holding Red Pill) -->
    <g id="hand-red-pill">
      <!-- Palm -->
      <ellipse cx="110" cy="295" rx="36" ry="24" fill="#C48E72" stroke="#543324" stroke-width="1.5"/>
      <!-- Fingers curled upward holding pill -->
      <path d="M 80,295 C 75,270 90,265 95,285" fill="#B37D62" stroke="#543324" stroke-width="1.5"/>
      <path d="M 95,285 C 95,260 110,258 112,280" fill="#B37D62" stroke="#543324" stroke-width="1.5"/>
      <path d="M 112,280 C 115,260 130,260 128,282" fill="#B37D62" stroke="#543324" stroke-width="1.5"/>
      <path d="M 128,282 C 132,268 144,272 138,290" fill="#B37D62" stroke="#543324" stroke-width="1.5"/>
      <!-- Thumb -->
      <path d="M 130,305 C 145,300 148,312 135,318" fill="#B37D62" stroke="#543324" stroke-width="1.5"/>

      <!-- Glowing Red Pill Floating / Resting on Palm -->
      <g transform="translate(108, 275) rotate(-15)" filter="url(#redPillGlow)">
        <!-- Pill Aura / Radiance -->
        <circle cx="0" cy="0" r="28" fill="#FF0033" opacity="0.35"/>
        <ellipse cx="0" cy="0" rx="20" ry="9" fill="url(#redPillGrad)" stroke="#FF8095" stroke-width="1.2"/>
        <!-- Pill Highlight Glint -->
        <ellipse cx="-4" cy="-3" rx="10" ry="3" fill="#FFFFFF" opacity="0.65"/>
        <line x1="-1" y1="-8" x2="-1" y2="8" stroke="#FF4D6D" stroke-width="1" opacity="0.7"/>
      </g>
    </g>

    <!-- Hand Right (Holding Blue Pill) -->
    <g id="hand-blue-pill">
      <!-- Palm -->
      <ellipse cx="410" cy="295" rx="36" ry="24" fill="#C48E72" stroke="#543324" stroke-width="1.5"/>
      <!-- Fingers curled upward holding pill -->
      <path d="M 440,295 C 445,270 430,265 425,285" fill="#B37D62" stroke="#543324" stroke-width="1.5"/>
      <path d="M 425,285 C 425,260 410,258 408,280" fill="#B37D62" stroke="#543324" stroke-width="1.5"/>
      <path d="M 408,280 C 405,260 390,260 392,282" fill="#B37D62" stroke="#543324" stroke-width="1.5"/>
      <path d="M 392,282 C 388,268 376,272 382,290" fill="#B37D62" stroke="#543324" stroke-width="1.5"/>
      <!-- Thumb -->
      <path d="M 390,305 C 375,300 372,312 385,318" fill="#B37D62" stroke="#543324" stroke-width="1.5"/>

      <!-- Glowing Blue Pill Floating / Resting on Palm -->
      <g transform="translate(412, 275) rotate(15)" filter="url(#bluePillGlow)">
        <!-- Pill Aura / Radiance -->
        <circle cx="0" cy="0" r="28" fill="#00B4D8" opacity="0.35"/>
        <ellipse cx="0" cy="0" rx="20" ry="9" fill="url(#bluePillGrad)" stroke="#90E0EF" stroke-width="1.2"/>
        <!-- Pill Highlight Glint -->
        <ellipse cx="4" cy="-3" rx="10" ry="3" fill="#FFFFFF" opacity="0.65"/>
        <line x1="1" y1="-8" x2="1" y2="8" stroke="#48CAE4" stroke-width="1" opacity="0.7"/>
      </g>
    </g>
  </g>

  <!-- Neo's Dialogue Callout Banner at Bottom -->
  <rect x="50" y="335" width="420" height="34" rx="8" fill="#031206" stroke="#00FF66" stroke-width="1.2" opacity="0.9"/>
  <text x="260" y="356" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#00FF66" letter-spacing="1">
    "THE CHOICE IS YOURS, SAI."
  </text>
</svg>
